# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: forgeai

builds:
  - id: forgeai
    main: ./cmd/forgeai
    binary: forgeai
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: amd64
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - >-
        -s -w
        -X github.com/sibukixxx/rag-poc/internal/app.Version={{ .Version }}

archives:
  - id: forgeai
    ids:
      - forgeai
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "forgeai_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  disable: true
